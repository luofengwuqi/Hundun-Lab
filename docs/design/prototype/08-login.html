<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · Hundun Lab</title>
    <link rel="stylesheet" href="assets/proto.css" />
  </head>
  <body>
    <div class="login-page">
      <aside class="login-side">
        <h2>登录方式</h2>
        <ul>
          <li>
            <button class="login-tab is-on" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
              </svg>
              <span>用户名 + 密码</span>
            </button>
          </li>
          <li>
            <button class="login-tab" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="7" y="3" width="10" height="18" rx="2" />
                <path d="M11 18h2" />
              </svg>
              <span>手机号 + 密码</span>
            </button>
          </li>
          <li>
            <button class="login-tab" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="6" width="18" height="12" rx="2" />
                <path d="m4 8 8 6 8-6" />
              </svg>
              <span>邮箱 + 验证码</span>
            </button>
          </li>
          <li>
            <button class="login-tab" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <span>邮箱 + 密码</span>
            </button>
          </li>
        </ul>
      </aside>

      <main class="login-main">
        <div class="login-corner">
          <span class="lang"><b>中</b><span>/</span>EN</span>
          <button class="icon-btn" type="button" title="深色主题（延后实现）" aria-label="切换主题">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="8" />
              <path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>

        <form class="login-card" action="01-home.html">
          <div style="display: flex; justify-content: center; margin-bottom: 12px">
            <span class="brand__mark" style="grid-template-columns: repeat(2, 12px); grid-template-rows: repeat(2, 12px)">
              <i></i><i></i><i></i><i></i>
            </span>
          </div>
          <div class="login-card__brand">HUNDUN<em>LAB</em></div>
          <div class="login-card__tag">把工具做成卡带</div>

          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
            </svg>
            <input class="input" placeholder="请输入用户名" />
          </div>

          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
            <input class="input" type="password" placeholder="请输入密码" />
            <span class="input-icon__tail">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z" />
                <circle cx="12" cy="12" r="2.6" />
              </svg>
            </span>
          </div>

          <div class="login-actions">
            <button class="btn btn--primary" type="submit">登录</button>
            <a class="btn btn--ghost" href="07-user-info.html">注册</a>
          </div>

          <div class="login-foot">
            <label class="checkbox"><input type="checkbox" checked />记住我</label>
            <a href="#">忘记密码</a>
          </div>
        </form>

        <div class="login-copy">© HUNDUNLAB · 独立软件工作室</div>
      </main>
    </div>
  </body>
</html>
