<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hundun Lab · 首页</title>
    <link rel="stylesheet" href="assets/proto.css" />
    <style>
      /* ==================================================================
         01 首页 · 版式对齐 redesign 参考图
         配色沿用全站令牌（纸 + 朱红 + 深棕），头部与其他页完全一致
         ================================================================== */

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        align-items: start;
        gap: 16px;
        padding: 30px 0 16px;
      }

      /* 注意：本页 hero 右侧的 SVG 插画（瓦片 / 积木 / 掌机）内部带一套固定色，
         那是"画出来的物件"而不是界面色板，不受主题令牌约束；
         主题切换时它们保持原色（深色下由 proto.css 统一降一点亮度）。 */

      .hero__title {
        margin: 0;
        font-size: 84px;
        line-height: 1.03;
        font-weight: 900;
        letter-spacing: 0.01em;
        color: var(--ink);
      }

      .hero__dot {
        display: inline-block;
        width: 14px;
        height: 21px;
        margin-left: 9px;
        vertical-align: 3px;
        background: var(--red);
      }

      .hero__lead {
        margin: 24px 0 0;
        font-size: 19px;
        line-height: 2.05;
        color: var(--ink-soft);
      }

      .hero__lead b {
        display: block;
        font-weight: 400;
      }

      .hero__actions {
        display: flex;
        align-items: center;
        gap: 34px;
        margin-top: 24px;
      }

      .hero__actions .btn {
        padding: 15px 26px;
        font-size: 18px;
      }

      .hero__link {
        font-size: 18px;
        color: var(--ink);
        text-decoration: none;
      }

      .hero__link:hover {
        color: var(--red);
      }

      /* 右侧：四块 3D 瓦片 + 积木 */
      .hero__art {
        margin: 0;
        padding-top: 6px;
      }

      .hero__art {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .hero__art svg {
        display: block;
        width: auto;
        height: 372px;
        max-width: 100%;
      }

      .hero__art figcaption {
        align-self: stretch;
        margin-top: 8px;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.16em;
        color: var(--ink-soft);
      }

      /* ---------- 软件与实验 ---------- */

      .bleed {
        margin-inline: calc(50% - 50vw);
      }

      .hero-rule {
        border: 0;
        border-top: 1px solid var(--ink-a28);
        margin-block: 0 0;
      }

      .shelf__head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        padding-top: 26px;
      }

      .shelf__head h2 {
        margin: 0;
        font-size: 44px;
        line-height: 1.1;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: var(--ink);
      }

      .shelf__head .v3-mono {
        color: var(--red);
        font-size: 13px;
        letter-spacing: 0.16em;
        padding-bottom: 8px;
      }

      .shelf__grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.4fr) minmax(0, 0.4fr);
        gap: 44px;
        margin-top: 22px;
        align-items: stretch;
      }

      /* 主产品卡 */
      .product {
        position: relative;
        background: var(--card);
        border: 1px solid var(--ink-a22);
        border-radius: 3px;
        box-shadow: 14px 16px 24px var(--ink-a14);
        min-height: 320px;
        padding: 30px 34px 28px;
      }

      /* 顶部红胶带，右端斜切 */
      .product__tape {
        position: absolute;
        top: -1px;
        left: -1px;
        width: 44%;
        height: 11px;
        background: var(--red);
        clip-path: polygon(0 0, 100% 0, 93% 100%, 0 100%);
      }

      /* 右上折角 */
      .product__fold {
        position: absolute;
        top: -1px;
        right: -1px;
        width: 46px;
        height: 46px;
        background: linear-gradient(225deg, var(--paper) 0 49.4%, var(--ink-a22) 50%, var(--card) 51% 100%);
        clip-path: polygon(100% 0, 100% 100%, 0 0);
        border-top-right-radius: 3px;
        filter: drop-shadow(-2px 2px 2px var(--ink-a14));
      }

      .product__label {
        display: block;
        margin-top: 6px;
        color: var(--red);
        font-size: 13px;
        letter-spacing: 0.1em;
      }

      .product h3 {
        margin: 8px 0 0;
        font-size: 44px;
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: 0.005em;
        color: var(--ink);
      }

      .product p {
        margin: 12px 0 0;
        font-size: 16px;
        color: var(--ink-soft);
        max-width: 16em;
      }

      .product__tags {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .product__tags span {
        padding: 4px 12px;
        border: 1px solid var(--ink-a30);
        border-radius: 2px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
        background: var(--sheen-strong);
      }

      .product .btn {
        margin-top: 18px;
        padding: 13px 24px;
        font-size: 16px;
      }

      .product__art {
        position: absolute;
        right: -22px;
        /* 越出卡底是设计的一部分，但 34px 会顶到页脚边框（页脚加边框后暴露）。
           12px 既保留溢出手感，又不侵入页脚（2026-11-05 修）。 */
        bottom: -10px;
        width: 200px;
        transform: rotate(-2deg);
        pointer-events: none;
        filter: drop-shadow(10px 14px 18px var(--ink-a28));
      }

      .product__art svg {
        display: block;
        width: 100%;
        height: auto;
      }

      /* 右侧两张实验卡 */
      .stack {
        display: contents;
      }

      .mini {
        display: flex;
        flex-direction: column;
        position: relative;
        background: var(--card);
        border: 1px solid var(--ink-a22);
        border-radius: 3px;
        box-shadow: 10px 12px 20px var(--ink-a12);
        padding: 24px 24px 22px;
      }

      .mini__bar {
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        height: 7px;
        border-radius: 3px 3px 0 0;
      }

      .mini--green .mini__bar {
        background:
          repeating-linear-gradient(90deg, var(--sheen) 0 5px, transparent 5px 12px),
          var(--teal);
      }

      .mini--amber .mini__bar {
        background:
          repeating-linear-gradient(90deg, var(--sheen) 0 5px, transparent 5px 12px),
          var(--amber);
      }

      .mini__icon {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 3px;
        margin-top: 4px;
      }

      .mini--green .mini__icon {
        background: var(--teal);
        color: var(--on-teal);
        box-shadow: 0 0 0 2px var(--teal-a22);
      }

      .mini--amber .mini__icon {
        background: var(--amber);
        color: var(--red);
        box-shadow: 0 0 0 2px var(--amber-a22);
      }

      .mini__state {
        display: block;
        margin-top: 26px;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--red);
        letter-spacing: 0.04em;
      }

      .mini h4 {
        margin: 10px 0 0;
        font-size: 21px;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: var(--ink);
      }

      .mini p {
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.75;
        color: var(--ink-soft);
      }

      /* ---------- 页脚 ----------
         .foot 一套已提到 assets/proto.css（2026-11-05），
         02/03 也用同一个页脚，本页不再重复定义。 */

      @media (max-width: 1120px) {
        .hero {
          grid-template-columns: minmax(0, 1fr);
          padding-bottom: 30px;
        }

        /* 注意：本页 hero 右侧的 SVG 插画（瓦片 / 积木 / 掌机）内部带一套固定色，
         那是"画出来的物件"而不是界面色板，不受主题令牌约束；
         主题切换时它们保持原色（深色下由 proto.css 统一降一点亮度）。 */

      .hero__title {
          font-size: 62px;
        }

        .shelf__grid {
          grid-template-columns: minmax(0, 1fr);
        }

        .product__art {
          position: static;
          width: 180px;
          margin: 22px auto 0;
        }
      }
    </style>
    <script>
      /* 主题：内联脚本先于 body 执行，避免首屏闪白（D061）。取值 light / dark（D081）。 */
      (function () {
        try {
          var t = localStorage.getItem("hundunlab.theme");
          if (t !== "dark" && t !== "light") t = "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <script>
      /* 主题切换：数据属性 + 本地存储。原型不引框架，故用原生事件委托。 */
      (function () {
        function sync() {
          var dark = document.documentElement.getAttribute("data-theme") === "dark";
          document.querySelectorAll('[data-action="toggle-theme"]').forEach(function (b) {
            b.title = dark ? "切换到浅色主题" : "切换到深色主题";
            b.setAttribute("aria-pressed", dark ? "true" : "false");
          });
        }
        document.addEventListener("click", function (e) {
          var b = e.target.closest && e.target.closest('[data-action="toggle-theme"]');
          if (!b) return;
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          try {
            localStorage.setItem("hundunlab.theme", next);
          } catch (err) {}
          sync();
        });
        sync();
      })();
    </script>
