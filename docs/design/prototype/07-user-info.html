    <script>
      /* 主题切换：数据属性 + 本地存储。原型不引框架，故用原生事件委托。 */
      (function () {
        function sync() {
          var dark = document.documentElement.getAttribute("data-theme") === "dark";
          document.querySelectorAll('[data-action="toggle-theme"]').forEach(function (b) {
            b.title = dark ? "切换到浅色主题" : "切换到深色主题";
            b.setAttribute("aria-pressed", dark ? "true" : "false");
          });
        }
        document.addEventListener("click", function (e) {
          var b = e.target.closest && e.target.closest('[data-action="toggle-theme"]');
          if (!b) return;
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          try {
            localStorage.setItem("hundunlab.theme", next);
          } catch (err) {}
          sync();
        });
        sync();
      })();
    </script>
