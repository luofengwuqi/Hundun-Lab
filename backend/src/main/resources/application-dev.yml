# 敏感配置（阿里云 AK/SK 等）从本地文件加载，该文件已被 .gitignore 忽略
spring:
  config:
    import: optional:classpath:application-secret.yml

# 自定义配置
hundun-lab:
  mysql:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hundun_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket-name: hundun-lab
    domain: http://hundun-lab.oss-cn-beijing.aliyuncs.com
  #redis配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 10
