# 本地开发配置。
# 敏感项（OSS AK/SK、JWT 密钥、邮箱授权码）统一放在 application-secret.yml，该文件已被 .gitignore 忽略。
spring:
  config:
    import: optional:classpath:application-secret.yml
  devtools:
    restart:
      # 开发环境关掉热重启：本项目的 devtools 重启是「一触即死」，不是偶发。
      # 触发重启后新上下文里 MyBatis 解析 mapper-locations（classpath:com/hundunlab/site/module/*/mapper/*.xml）
      # 会命中已 stop 的旧 WebApplicationContext，抛
      #   IllegalStateException: Illegal access: this web application instance has been stopped already.
      #   Could not load [com/hundunlab/site/module/]
      # 于是 Application run failed：进程还在、5757 端口消失，Vite 代理把 ECONNREFUSED 映射成 500，
      # 浏览器只看到「服务器开小差了，请稍后再试」。
      # 曾尝试用 trigger-file 收窄重启信号，结论是「不误触发」能解决，但「主动触发」照样挂，故直接禁用。
      # 改完后端代码请整体重启（mvn spring-boot:run）；它本来就只有几秒，比修挂掉的进程快。
      enabled: false

hundun-lab:
  mysql:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/hundun_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 不提供默认口令，缺失时由连接失败暴露问题，避免弱口令被带进任何环境
    password: ${DB_PASSWORD:}
  alioss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket-name: ${OSS_BUCKET:}
    # 私有读桶，装安装包与扩展 zip（D102）；留空则回退到 bucket-name
    private-bucket-name: ${OSS_PRIVATE_BUCKET:}
    domain: ${OSS_DOMAIN:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    # 单位毫秒。原来写 10 就是 10ms——首次建连要 DNS + TCP + Netty 初始化，
    # 必然超过 10ms，于是启动后第一个碰 Redis 的请求（登录限流 INCR）一定失败，
    # 之后复用共享连接才正常，表现为「刚启动必登录不上，再试就好」。
    timeout: ${REDIS_TIMEOUT:2000}
    # 单独给建连超时，别让命令超时兼职；两条链路都留够握手时间
    connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000}
