# 本地开发配置。
# 敏感项（OSS AK/SK、JWT 密钥、邮箱授权码）统一放在 application-secret.yml，该文件已被 .gitignore 忽略。
spring:
  config:
    import: optional:classpath:application-secret.yml

hundun-lab:
  mysql:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/hundun_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 不提供默认口令，缺失时由连接失败暴露问题，避免弱口令被带进任何环境
    password: ${DB_PASSWORD:}
  alioss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket-name: ${OSS_BUCKET:}
    domain: ${OSS_DOMAIN:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    # 单位毫秒。原来写 10 就是 10ms——首次建连要 DNS + TCP + Netty 初始化，
    # 必然超过 10ms，于是启动后第一个碰 Redis 的请求（登录限流 INCR）一定失败，
    # 之后复用共享连接才正常，表现为「刚启动必登录不上，再试就好」。
    timeout: ${REDIS_TIMEOUT:2000}
    # 单独给建连超时，别让命令超时兼职；两条链路都留够握手时间
    connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000}
