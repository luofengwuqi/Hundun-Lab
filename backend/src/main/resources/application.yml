server:
  port: ${SERVER_PORT:5757}
  shutdown: graceful

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hundun-lab

  datasource:
    url: ${hundun-lab.mysql.url}
    username: ${hundun-lab.mysql.username}
    password: ${hundun-lab.mysql.password}
    driver-class-name: ${hundun-lab.mysql.driver-class-name}

  data:
    redis:
      host: ${hundun-lab.redis.host}
      port: ${hundun-lab.redis.port}
      password: ${hundun-lab.redis.password}
      database: ${hundun-lab.redis.database}
      timeout: ${hundun-lab.redis.timeout}

  # SMTP：账号密码缺失时应用照常启动，仅跳过邮件发送（见 SendMsgUtil）
  mail:
    host: ${MAIL_SMTP_HOST:smtp.qq.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_FROM:}
    password: ${MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000

  # 插件包体积远大于默认 1MB，必须显式放开；安装包下载走 OSS 直链，不占用这里的配额
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}

app:
  jwt:
    # 密钥必须至少 32 字节，缺失或过短时应用拒绝启动（安全要求，不做降级）
    secret: ${JWT_SECRET:}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}
  cors:
    # 允许携带凭证的跨域来源，多个用英文逗号分隔；生产同源部署时可留空
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5577,http://127.0.0.1:5577}
  upload:
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:10485760}
  security:
    # 只有部署在可信反向代理（Nginx）后面时才设为 true，否则 X-Forwarded-For 可被伪造
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}

# 阿里云 OSS：AccessKey 缺失时对象存储能力禁用，不影响应用启动
aliyun:
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:${hundun-lab.alioss.access-key-id:}}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:${hundun-lab.alioss.access-key-secret:}}
  bucket-name: ${hundun-lab.alioss.bucket-name}
  domain: ${hundun-lab.alioss.domain}

mybatis:
  configuration:
    # 下划线列名自动映射到驼峰属性
    map-underscore-to-camel-case: true
  mapper-locations: classpath:com/hundunlab/site/module/*/mapper/*.xml
